<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When It Calls</title>
<meta name="description" content="A small first-person stealth-horror fragment inspired by qntm's There Is No Antimemetics Division. Get out of the city. Don't be seen.">
<style>
  :root {
    --bg: #070304;
    --ink: #e8d9d2;
    --ink-dim: #9c8a84;
    --accent: #d23a26;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #070304; --ink: #e8d9d2; }
  }
  :root[data-theme="dark"] { --bg: #070304; --ink: #e8d9d2; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
    -webkit-user-select: none;
    user-select: none;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; outline: none; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: var(--ink-dim); letter-spacing: 0.3em; font-size: 12px;
  }
  /* Opacity animates on the compositor, so it keeps pulsing while the city is built (one long
     synchronous task): the page visibly is not frozen. */
  #boot span { animation: boot-pulse 1.6s ease-in-out infinite; }
  @keyframes boot-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #boot span { animation: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot" role="status"><span>LOADING</span></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0">This game needs JavaScript.</p></noscript>
<!-- BUNDLE -->
</body>
</html>
